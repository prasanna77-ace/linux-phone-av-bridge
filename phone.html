<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phone Remote Studio Pro</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .touch-surface { background: radial-gradient(circle at center, rgba(30, 41, 59, 0.75) 0%, rgba(15, 23, 42, 0.98) 100%); }
        .oled-blackout { background-color: #000000 !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between select-none touch-none overflow-hidden">

    <audio id="remoteAudio" autoplay playsinline></audio>

    <!-- Top Status Header -->
    <header class="p-3 bg-slate-900/90 backdrop-blur border-b border-slate-800 flex items-center justify-between z-10">
        <div class="flex items-center gap-2">
            <span id="dot" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
            <span id="status-text" class="text-xs font-bold text-slate-300">Disconnected</span>
        </div>
        <div class="flex items-center gap-2">
            <span id="batt" class="text-xs font-bold text-slate-400">🔋 100%</span>
            <a id="certPair" href="#" target="_blank" class="hidden px-2 py-1 bg-amber-500 text-slate-950 text-[10px] font-bold rounded-lg">Allow SSL</a>
            <button id="phone-conn-btn" onclick="togglePhoneConnection()" class="px-3 py-1 rounded-full bg-emerald-500 text-slate-950 font-bold text-xs shadow transition active:scale-95">
                Connect
            </button>
        </div>
    </header>

    <!-- Hardware Usage & DSP Status Bar -->
    <div class="bg-slate-900/60 border-b border-slate-800/80 px-3 py-1.5 flex items-center justify-between text-[10px] font-bold z-10">
        <div class="flex items-center gap-2">
            <span id="badge-cam" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">CAM: OFF</span>
            <span id="badge-mic" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">MIC: OFF</span>
            <span class="px-1.5 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/20">DSP: AEC+NS</span>
        </div>
        <button onclick="toggleOLEDDimmer()" class="text-sky-400 hover:text-sky-300">🌑 OLED Save</button>
    </div>

    <!-- Main Controller Surface -->
    <main class="flex-1 flex flex-col p-3 space-y-2.5 relative">
        
        <!-- Precision Touchpad -->
        <div id="trackpad" class="flex-1 touch-surface rounded-3xl border border-slate-800 flex flex-col items-center justify-center text-slate-400 font-semibold text-xs active:border-sky-500/60 transition shadow-inner">
            <div class="w-10 h-10 rounded-2xl bg-slate-800/70 flex items-center justify-center mb-1 text-sky-400 text-lg shadow">👆</div>
            <span class="tracking-wide text-slate-300">Precision Touchpad Active</span>
            <span class="text-[10px] text-slate-500 font-normal mt-0.5">Tap: L-Click • 2-Finger: Scroll • Hold: Drag</span>
        </div>

        <!-- Hotkey Productivity Deck -->
        <div class="grid grid-cols-5 gap-1.5">
            <button onclick="sendHotkey('ctrl_c')" class="bg-slate-900 active:bg-sky-500 active:text-slate-950 border border-slate-800 py-1.5 rounded-xl font-bold text-[10px] text-slate-300">Copy</button>
            <button onclick="sendHotkey('ctrl_v')" class="bg-slate-900 active:bg-sky-500 active:text-slate-950 border border-slate-800 py-1.5 rounded-xl font-bold text-[10px] text-slate-300">Paste</button>
            <button onclick="sendHotkey('ctrl_z')" class="bg-slate-900 active:bg-sky-500 active:text-slate-950 border border-slate-800 py-1.5 rounded-xl font-bold text-[10px] text-slate-300">Undo</button>
            <button onclick="sendHotkey('alt_tab')" class="bg-slate-900 active:bg-sky-500 active:text-slate-950 border border-slate-800 py-1.5 rounded-xl font-bold text-[10px] text-slate-300">Alt+Tab</button>
            <button onclick="sendHotkey('super')" class="bg-slate-900 active:bg-sky-500 active:text-slate-950 border border-slate-800 py-1.5 rounded-xl font-bold text-[10px] text-sky-400">Super</button>
        </div>

        <!-- Camera Sliders -->
        <div class="bg-slate-900/60 p-2 rounded-2xl border border-slate-800 space-y-1.5">
            <div class="flex items-center justify-between text-[10px] font-bold text-slate-400">
                <span>🔍 Zoom: <span id="zoom-val" class="text-sky-400">1.0x</span></span>
                <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" oninput="applyCameraZoom(this.value)" class="w-2/3 accent-sky-400">
            </div>
            <div class="flex items-center justify-between text-[10px] font-bold text-slate-400">
                <span>☀️ Exposure: <span id="exp-val" class="text-sky-400">0</span></span>
                <input type="range" id="exp-slider" min="-2" max="2" step="0.5" value="0" oninput="applyCameraExposure(this.value)" class="w-2/3 accent-sky-400">
            </div>
        </div>

        <!-- Mouse Buttons & Drag Lock -->
        <div class="grid grid-cols-3 gap-2 h-11">
            <button id="btn-left" class="bg-slate-900 active:bg-sky-500 active:text-slate-950 border border-slate-800 rounded-2xl font-bold text-xs tracking-wider transition shadow-sm">LEFT</button>
            <button id="btn-drag" onclick="toggleDragLock()" class="bg-slate-900 border border-slate-800 rounded-2xl font-bold text-xs text-amber-400 transition shadow-sm">DRAG LOCK</button>
            <button id="btn-right" class="bg-slate-900 active:bg-sky-500 active:text-slate-950 border border-slate-800 rounded-2xl font-bold text-xs tracking-wider transition shadow-sm">RIGHT</button>
        </div>

        <!-- Hardware Matrix -->
        <div class="grid grid-cols-4 gap-2">
            <button onclick="toggleStream('video')" id="cam-btn" class="bg-slate-900 active:scale-95 border border-slate-800 py-2.5 rounded-2xl text-xs font-bold flex flex-col items-center gap-1 transition shadow-sm">
                <span>📷</span><span>Cam</span>
            </button>
            <button onclick="toggleStream('audio')" id="mic-btn" class="bg-slate-900 active:scale-95 border border-slate-800 py-2.5 rounded-2xl text-xs font-bold flex flex-col items-center gap-1 transition shadow-sm">
                <span>🎙️</span><span>Mic</span>
            </button>
            <button onclick="flipCamera()" class="bg-slate-900 active:scale-95 border border-slate-800 py-2.5 rounded-2xl text-xs font-bold flex flex-col items-center gap-1 transition shadow-sm">
                <span>🔄</span><span>Flip</span>
            </button>
            <button onclick="toggleTorch()" class="bg-slate-900 active:scale-95 border border-slate-800 py-2.5 rounded-2xl text-xs font-bold flex flex-col items-center gap-1 transition shadow-sm">
                <span>🔦</span><span>Torch</span>
            </button>
        </div>

        <!-- OLED Blackout Overlay -->
        <div id="oled-overlay" onclick="toggleOLEDDimmer()" class="hidden absolute inset-0 oled-blackout z-50 flex flex-col items-center justify-center text-slate-800 text-xs font-mono select-none">
            <span>[ OLED SAVER ACTIVE • TAP ANYWHERE TO WAKE ]</span>
        </div>
    </main>

    <!-- Mobile Footer Ad -->
    <footer class="p-2 bg-slate-950 border-t border-slate-900 z-10">
        <div class="bg-slate-900/40 rounded-xl p-1.5 text-center border border-slate-800/50">
            <div class="h-9 flex items-center justify-center text-[10px] text-slate-600 border border-dashed border-slate-800 rounded-lg">
                Mobile Clean Ad Placement (320x50)
            </div>
        </div>
    </footer>

    <script>
        // Register PWA Service Worker for standalone installation
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        const urlParams = new URLSearchParams(window.location.search);
        let host = urlParams.get('host') || localStorage.getItem('phonebridge_host') || `${window.location.hostname}:8443`;
        localStorage.setItem('phonebridge_host', host);

        let ws = null, pc = null, localStream = null;
        let currentFacingMode = "environment", torchActive = false;
        let wakeLock = null, isDragging = false, isPhoneConnected = false;

        document.getElementById('certPair').href = `https://${host}/api/status`;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }

        function releaseWakeLock() {
            if (wakeLock) { wakeLock.release(); wakeLock = null; }
        }

        function toggleOLEDDimmer() {
            const overlay = document.getElementById('oled-overlay');
            overlay.classList.toggle('hidden');
        }

        function startPhoneConnection() {
            if (ws) ws.close();
            ws = new WebSocket(`wss://${host}/ws/input`);

            ws.onopen = () => {
                isPhoneConnected = true;
                updatePhoneUI(true);
                requestWakeLock();
                startBatteryReporting();
                startAVStream();
            };

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.a === "phone_control") {
                        if (data.cmd === "toggle_cam") toggleStream('video');
                        if (data.cmd === "toggle_torch") toggleTorch();
                        if (data.cmd === "flip_cam") flipCamera();
                    }
                } catch(err) {}
            };

            ws.onerror = () => { isPhoneConnected = false; updatePhoneUI(false, true); };
            ws.onclose = () => { isPhoneConnected = false; updatePhoneUI(false); };
        }

        function disconnectPhoneConnection() {
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            if (pc) { pc.close(); pc = null; }
            if (ws) { ws.close(); ws = null; }
            releaseWakeLock();
            isPhoneConnected = false;
            updatePhoneUI(false);
        }

        function togglePhoneConnection() {
            if (isPhoneConnected) disconnectPhoneConnection();
            else startPhoneConnection();
        }

        function updatePhoneUI(connected, sslNeeded = false) {
            const dot = document.getElementById('dot');
            const statusText = document.getElementById('status-text');
            const connBtn = document.getElementById('phone-conn-btn');
            const certPair = document.getElementById('certPair');

            if (connected) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400';
                statusText.innerText = 'Studio Live';
                connBtn.innerText = 'Disconnect';
                connBtn.className = 'px-3 py-1 rounded-full bg-rose-500 text-white font-bold text-xs shadow transition active:scale-95';
                certPair.classList.add('hidden');
            } else if (sslNeeded) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse';
                statusText.innerText = 'SSL Pair Needed';
                connBtn.innerText = 'Retry';
                connBtn.className = 'px-3 py-1 rounded-full bg-amber-500 text-slate-950 font-bold text-xs shadow transition active:scale-95';
                certPair.classList.remove('hidden');
            } else {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-slate-500';
                statusText.innerText = 'Disconnected';
                connBtn.innerText = 'Connect';
                connBtn.className = 'px-3 py-1 rounded-full bg-emerald-500 text-slate-950 font-bold text-xs shadow transition active:scale-95';
                document.getElementById('badge-cam').className = "px-1.5 py-0.5 rounded bg-slate-800 text-slate-400";
                document.getElementById('badge-cam').innerText = "CAM: OFF";
                document.getElementById('badge-mic').className = "px-1.5 py-0.5 rounded bg-slate-800 text-slate-400";
                document.getElementById('badge-mic').innerText = "MIC: OFF";
            }
        }

        async function startAVStream() {
            try {
                // DSP Pipeline: Native Echo Cancellation + Noise Suppression + Auto Gain
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 1,
                        sampleRate: 48000
                    }
                });

                pc = new RTCPeerConnection({ iceServers: [] });
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                document.getElementById('badge-cam').className = "px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                document.getElementById('badge-cam').innerText = "CAM: ON";
                document.getElementById('badge-mic').className = "px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                document.getElementById('badge-mic').innerText = "MIC: ON";
                broadcastHardwareTelemetry(true, true);

                pc.ontrack = (event) => {
                    if (event.track.kind === "audio") {
                        document.getElementById("remoteAudio").srcObject = event.streams[0];
                    }
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const response = await fetch(`https://${host}/offer`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type, enable_pc_to_phone: true })
                });

                const answer = await response.json();
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
            } catch (err) {
                console.error("WebRTC AV Error:", err);
            }
        }

        function sendHotkey(combo) {
            if (navigator.vibrate) navigator.vibrate(15);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ a: "hotkey", k: combo }));
            }
        }

        async function applyCameraZoom(val) {
            document.getElementById('zoom-val').innerText = `${val}x`;
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            if (track && 'applyConstraints' in track) {
                try { await track.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] }); } catch(e) {}
            }
        }

        async function applyCameraExposure(val) {
            document.getElementById('exp-val').innerText = `${val}`;
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            if (track && 'applyConstraints' in track) {
                try { await track.applyConstraints({ advanced: [{ exposureCompensation: parseFloat(val) }] }); } catch(e) {}
            }
        }

        function toggleStream(kind) {
            if (!localStream) return;
            const track = localStream.getTracks().find(t => t.kind === kind);
            if (track) {
                track.enabled = !track.enabled;
                const btn = document.getElementById(kind === 'video' ? 'cam-btn' : 'mic-btn');
                btn.className = track.enabled ? 'bg-slate-900 border border-slate-800 py-2.5 rounded-2xl text-xs font-bold flex flex-col items-center gap-1 shadow-sm' : 'bg-rose-900/40 border border-rose-700 py-2.5 rounded-2xl text-xs font-bold text-rose-300 flex flex-col items-center gap-1 shadow-sm';
                
                const badge = document.getElementById(kind === 'video' ? 'badge-cam' : 'badge-mic');
                badge.innerText = `${kind.toUpperCase()}: ${track.enabled ? 'ON' : 'OFF'}`;
                badge.className = track.enabled ? "px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20" : "px-1.5 py-0.5 rounded bg-slate-800 text-slate-400";
                
                broadcastHardwareTelemetry(
                    localStream.getVideoTracks().some(t => t.enabled),
                    localStream.getAudioTracks().some(t => t.enabled)
                );
            }
        }

        function broadcastHardwareTelemetry(camActive, micActive) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    a: "telemetry",
                    battery: parseInt(document.getElementById('batt').innerText.replace(/\D/g, '')) || 100,
                    cam_active: camActive,
                    mic_active: micActive,
                    device: "Phone Remote Pro"
                }));
            }
        }

        async function flipCamera() {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                if (pc) pc.close();
                await startAVStream();
            }
        }

        async function toggleTorch() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            if (track && 'applyConstraints' in track) {
                torchActive = !torchActive;
                try { await track.applyConstraints({ advanced: [{ torch: torchActive }] }); } catch(e) {}
            }
        }

        function toggleDragLock() {
            isDragging = !isDragging;
            const btn = document.getElementById('btn-drag');
            if (isDragging) {
                btn.className = "bg-amber-500 text-slate-950 font-bold border border-amber-400 rounded-2xl text-xs shadow-sm";
                if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ a: "drag_start" }));
            } else {
                btn.className = "bg-slate-900 border border-slate-800 rounded-2xl font-bold text-xs text-amber-400 transition shadow-sm";
                if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ a: "drag_end" }));
            }
        }

        let lastX = 0, lastY = 0, touchStartTime = 0;
        const pad = document.getElementById('trackpad');

        pad.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                touchStartTime = Date.now();
            }
        });

        pad.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && ws && ws.readyState === WebSocket.OPEN) {
                const dx = e.touches[0].clientX - lastX;
                const dy = e.touches[0].clientY - lastY;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                ws.send(JSON.stringify({ a: "mm", dx: dx, dy: dy, sens: 1.6 }));
            } else if (e.touches.length === 2 && ws && ws.readyState === WebSocket.OPEN) {
                const dy = e.touches[0].clientY - lastY;
                lastY = e.touches[0].clientY;
                ws.send(JSON.stringify({ a: "sc", dy: dy > 0 ? -1 : 1 }));
            }
        });

        pad.addEventListener('touchend', (e) => {
            if (Date.now() - touchStartTime < 180 && e.changedTouches.length === 1) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    if (navigator.vibrate) navigator.vibrate(15);
                    ws.send(JSON.stringify({ a: "c", b: "l" }));
                }
            }
        });

        document.getElementById('btn-left').onclick = () => {
            if (navigator.vibrate) navigator.vibrate(15);
            ws && ws.send(JSON.stringify({ a: "c", b: "l" }));
        };
        document.getElementById('btn-right').onclick = () => {
            if (navigator.vibrate) navigator.vibrate(15);
            ws && ws.send(JSON.stringify({ a: "c", b: "r" }));
        };

        function startBatteryReporting() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(batt => {
                    const send = () => {
                        const level = Math.round(batt.level * 100);
                        document.getElementById('batt').innerText = `🔋 ${level}%`;
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({
                                a: "telemetry",
                                battery: level,
                                charging: batt.charging,
                                device: "Phone Remote Pro",
                                cam_active: localStream ? localStream.getVideoTracks().some(t => t.enabled) : false,
                                mic_active: localStream ? localStream.getAudioTracks().some(t => t.enabled) : false
                            }));
                        }
                    };
                    send();
                    batt.onlevelchange = send;
                    batt.onchargingchange = send;
                });
            }
        }

        window.onload = startPhoneConnection;
    </script>
</body>
</html>
