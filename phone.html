<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phone AV & Input Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between select-none touch-none">

    <header class="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span id="dot" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
            <span id="status-text" class="text-xs font-semibold text-slate-300">Connecting...</span>
        </div>
        <div class="flex items-center gap-3 text-xs text-slate-400">
            <span id="batt">🔋 --%</span>
            <a id="certPair" href="#" target="_blank" class="hidden text-sky-400 underline font-semibold">Allow SSL</a>
        </div>
    </header>

    <main class="flex-1 flex flex-col p-3 space-y-3">
        <div id="trackpad" class="flex-1 bg-slate-900/80 rounded-2xl border border-slate-800 flex flex-col items-center justify-center text-slate-500 font-medium text-xs active:border-sky-500/50 transition">
            <span>Touch & Drag: Move Cursor</span>
            <span class="text-[10px] text-slate-600 mt-1">Tap: Left Click | 2-Finger Tap: Right Click</span>
        </div>

        <div class="grid grid-cols-2 gap-2 h-14">
            <button id="btn-left" class="bg-slate-900 active:bg-sky-500 active:text-slate-950 border border-slate-800 rounded-xl font-bold text-sm">L-CLICK</button>
            <button id="btn-right" class="bg-slate-900 active:bg-sky-500 active:text-slate-950 border border-slate-800 rounded-xl font-bold text-sm">R-CLICK</button>
        </div>

        <div class="grid grid-cols-4 gap-2">
            <button onclick="toggleStream('video')" id="cam-btn" class="bg-slate-900 border border-slate-800 py-2.5 rounded-xl text-xs font-semibold">📷 Cam</button>
            <button onclick="toggleStream('audio')" id="mic-btn" class="bg-slate-900 border border-slate-800 py-2.5 rounded-xl text-xs font-semibold">🎙️ Mic</button>
            <button onclick="flipCamera()" class="bg-slate-900 border border-slate-800 py-2.5 rounded-xl text-xs font-semibold">🔄 Flip</button>
            <button onclick="toggleTorch()" class="bg-slate-900 border border-slate-800 py-2.5 rounded-xl text-xs font-semibold">🔦 Torch</button>
        </div>

        <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80 flex items-center justify-between">
            <label class="text-xs text-slate-400 font-medium">Send File to PC</label>
            <input type="file" id="fileInput" onchange="uploadSelectedFile()" class="text-xs file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-sky-500 file:text-slate-950">
        </div>
    </main>

    <footer class="p-2 bg-slate-950 border-t border-slate-900">
        <div class="bg-slate-900/40 rounded-lg p-2 text-center border border-slate-800/50">
            <span class="text-[9px] uppercase tracking-widest text-slate-600 block">Sponsor</span>
            <div class="h-10 flex items-center justify-center text-[10px] text-slate-600 border border-dashed border-slate-800/80 rounded">
                Mobile Banner Ad Unit (320x50)
            </div>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let host = urlParams.get('host') || localStorage.getItem('phonebridge_host') || `${window.location.hostname}:8443`;
        localStorage.setItem('phonebridge_host', host);

        let ws = null;
        let pc = null;
        let localStream = null;
        let currentFacingMode = "environment";
        let torchActive = false;

        document.getElementById('certPair').href = `https://${host}/api/status`;

        function initWebSocket() {
            ws = new WebSocket(`wss://${host}/ws/input`);

            ws.onopen = () => {
                document.getElementById('dot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-400';
                document.getElementById('status-text').innerText = 'Connected';
                document.getElementById('certPair').classList.add('hidden');
                startBatteryReporting();
                startAVStream();
            };

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.a === "phone_control") {
                        if (data.cmd === "toggle_cam") toggleStream('video');
                        if (data.cmd === "toggle_torch") toggleTorch();
                        if (data.cmd === "flip_cam") flipCamera();
                    }
                } catch(err) {}
            };

            ws.onerror = () => {
                document.getElementById('dot').className = 'w-2.5 h-2.5 rounded-full bg-amber-400';
                document.getElementById('status-text').innerText = 'Allow SSL Needed';
                document.getElementById('certPair').classList.remove('hidden');
            };

            ws.onclose = () => {
                document.getElementById('dot').className = 'w-2.5 h-2.5 rounded-full bg-rose-400';
                document.getElementById('status-text').innerText = 'Disconnected';
                setTimeout(initWebSocket, 3000);
            };
        }

        async function startAVStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
                    audio: true
                });

                pc = new RTCPeerConnection({ iceServers: [] });
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const response = await fetch(`https://${host}/offer`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
                });

                const answer = await response.json();
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
            } catch (err) {
                console.error("WebRTC Error:", err);
            }
        }

        function toggleStream(kind) {
            if (!localStream) return;
            const track = localStream.getTracks().find(t => t.kind === kind);
            if (track) {
                track.enabled = !track.enabled;
                const btn = document.getElementById(kind === 'video' ? 'cam-btn' : 'mic-btn');
                btn.className = track.enabled ? 'bg-slate-900 border border-slate-800 py-2.5 rounded-xl text-xs font-semibold' : 'bg-rose-900/60 border border-rose-700 py-2.5 rounded-xl text-xs font-semibold text-rose-200';
            }
        }

        async function flipCamera() {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                if (pc) pc.close();
                await startAVStream();
            }
        }

        async function toggleTorch() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            if (track && 'applyConstraints' in track) {
                torchActive = !torchActive;
                try {
                    await track.applyConstraints({ advanced: [{ torch: torchActive }] });
                } catch(e) {}
            }
        }

        let lastX = 0, lastY = 0, touchStartTime = 0;
        const pad = document.getElementById('trackpad');

        pad.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                touchStartTime = Date.now();
            }
        });

        pad.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && ws && ws.readyState === WebSocket.OPEN) {
                const dx = e.touches[0].clientX - lastX;
                const dy = e.touches[0].clientY - lastY;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                ws.send(JSON.stringify({ a: "mm", dx: dx, dy: dy, sens: 1.6 }));
            } else if (e.touches.length === 2 && ws && ws.readyState === WebSocket.OPEN) {
                const dy = e.touches[0].clientY - lastY;
                lastY = e.touches[0].clientY;
                ws.send(JSON.stringify({ a: "sc", dy: dy > 0 ? -1 : 1 }));
            }
        });

        pad.addEventListener('touchend', (e) => {
            if (Date.now() - touchStartTime < 180 && e.changedTouches.length === 1) {
                if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ a: "c", b: "l" }));
            }
        });

        document.getElementById('btn-left').onclick = () => ws && ws.send(JSON.stringify({ a: "c", b: "l" }));
        document.getElementById('btn-right').onclick = () => ws && ws.send(JSON.stringify({ a: "c", b: "r" }));

        async function uploadSelectedFile() {
            const input = document.getElementById('fileInput');
            if (!input.files.length) return;
            const formData = new FormData();
            formData.append('file', input.files[0]);

            try {
                await fetch(`https://${host}/api/upload`, { method: 'POST', body: formData });
                alert('File sent to PC!');
                input.value = '';
            } catch (err) {
                alert('Upload failed.');
            }
        }

        function startBatteryReporting() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(batt => {
                    const send = () => {
                        const level = Math.round(batt.level * 100);
                        document.getElementById('batt').innerText = `🔋 ${level}%`;
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ a: "telemetry", battery: level, charging: batt.charging, device: "Mobile" }));
                        }
                    };
                    send();
                    batt.onlevelchange = send;
                    batt.onchargingchange = send;
                });
            }
        }

        window.onload = initWebSocket;
    </script>
</body>
</html>
