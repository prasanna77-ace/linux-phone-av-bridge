<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phone Remote Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .touch-surface { background: radial-gradient(circle at center, rgba(30, 41, 59, 0.75) 0%, rgba(15, 23, 42, 0.98) 100%); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between select-none touch-none overflow-hidden">

    <!-- Bi-Directional Remote Audio Player (Plays PC sound on phone) -->
    <audio id="remoteAudio" autoplay playsinline></audio>

    <!-- Top Status Bar -->
    <header class="p-3 bg-slate-900/90 backdrop-blur border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span id="dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
            <span id="status-text" class="text-xs font-bold text-slate-300">Connecting...</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="audio-indicator" class="text-[10px] font-bold text-sky-400 bg-sky-500/10 px-2 py-0.5 rounded-full border border-sky-500/20">🔊 PC AUDIO ON</span>
            <span id="batt" class="text-xs font-bold text-slate-400">🔋 100%</span>
            <a id="certPair" href="#" target="_blank" class="hidden px-2.5 py-1 bg-amber-500 text-slate-950 text-[11px] font-bold rounded-lg">Allow SSL</a>
        </div>
    </header>

    <!-- Main Touchpad & Hardware Controls -->
    <main class="flex-1 flex flex-col p-3 space-y-3">
        
        <!-- Interactive Multi-Touch Surface -->
        <div id="trackpad" class="flex-1 touch-surface rounded-3xl border border-slate-800 flex flex-col items-center justify-center text-slate-400 font-semibold text-xs active:border-sky-500/60 transition shadow-inner">
            <div class="w-12 h-12 rounded-2xl bg-slate-800/70 flex items-center justify-center mb-2 text-sky-400 text-xl shadow">👆</div>
            <span class="tracking-wide text-slate-300">Precision Touchpad Active</span>
            <span class="text-[10px] text-slate-500 font-normal mt-1">Tap: L-Click • 2-Finger: Scroll • Hold: Drag</span>
        </div>

        <!-- Mouse Buttons & Drag Lock -->
        <div class="grid grid-cols-3 gap-2 h-13">
            <button id="btn-left" class="bg-slate-900 active:bg-sky-500 active:text-slate-950 border border-slate-800 rounded-2xl font-bold text-xs tracking-wider transition shadow-sm">LEFT</button>
            <button id="btn-drag" onclick="toggleDragLock()" class="bg-slate-900 border border-slate-800 rounded-2xl font-bold text-xs text-amber-400 transition shadow-sm">DRAG LOCK</button>
            <button id="btn-right" class="bg-slate-900 active:bg-sky-500 active:text-slate-950 border border-slate-800 rounded-2xl font-bold text-xs tracking-wider transition shadow-sm">RIGHT</button>
        </div>

        <!-- AV & Sensor Matrix -->
        <div class="grid grid-cols-4 gap-2">
            <button onclick="toggleStream('video')" id="cam-btn" class="bg-slate-900 active:scale-95 border border-slate-800 py-3 rounded-2xl text-xs font-bold flex flex-col items-center gap-1 transition shadow-sm">
                <span>📷</span><span>Cam</span>
            </button>
            <button onclick="toggleStream('audio')" id="mic-btn" class="bg-slate-900 active:scale-95 border border-slate-800 py-3 rounded-2xl text-xs font-bold flex flex-col items-center gap-1 transition shadow-sm">
                <span>🎙️</span><span>Mic</span>
            </button>
            <button onclick="flipCamera()" class="bg-slate-900 active:scale-95 border border-slate-800 py-3 rounded-2xl text-xs font-bold flex flex-col items-center gap-1 transition shadow-sm">
                <span>🔄</span><span>Flip</span>
            </button>
            <button onclick="toggleTorch()" class="bg-slate-900 active:scale-95 border border-slate-800 py-3 rounded-2xl text-xs font-bold flex flex-col items-center gap-1 transition shadow-sm">
                <span>🔦</span><span>Torch</span>
            </button>
        </div>

        <!-- Direct File Relay -->
        <div class="bg-slate-900/60 p-2 rounded-2xl border border-slate-800/80 flex items-center justify-between">
            <span class="text-[11px] font-bold text-slate-400 ml-1">Send to PC:</span>
            <input type="file" id="fileInput" onchange="uploadSelectedFile()" class="text-xs file:mr-2 file:py-1 file:px-3 file:rounded-xl file:border-0 file:text-[11px] file:font-bold file:bg-sky-500 file:text-slate-950">
        </div>
    </main>

    <!-- Mobile Footer Ad -->
    <footer class="p-2 bg-slate-950 border-t border-slate-900">
        <div class="bg-slate-900/40 rounded-xl p-1.5 text-center border border-slate-800/50">
            <div class="h-10 flex items-center justify-center text-[10px] text-slate-600 border border-dashed border-slate-800 rounded-lg">
                Mobile Banner Ad Unit (320x50)
            </div>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let host = urlParams.get('host') || localStorage.getItem('phonebridge_host') || `${window.location.hostname}:8443`;
        localStorage.setItem('phonebridge_host', host);

        let ws = null, pc = null, localStream = null;
        let currentFacingMode = "environment", torchActive = false;
        let wakeLock = null, isDragging = false;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }

        document.getElementById('certPair').href = `https://${host}/api/status`;

        function initWebSocket() {
            ws = new WebSocket(`wss://${host}/ws/input`);

            ws.onopen = () => {
                document.getElementById('dot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-400';
                document.getElementById('status-text').innerText = 'Studio Live';
                document.getElementById('certPair').classList.add('hidden');
                requestWakeLock();
                startBatteryReporting();
                startAVStream();
            };

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.a === "phone_control") {
                        if (data.cmd === "toggle_cam") toggleStream('video');
                        if (data.cmd === "toggle_torch") toggleTorch();
                        if (data.cmd === "flip_cam") flipCamera();
                    }
                } catch(err) {}
            };

            ws.onerror = () => {
                document.getElementById('dot').className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse';
                document.getElementById('status-text').innerText = 'SSL Pair Needed';
                document.getElementById('certPair').classList.remove('hidden');
            };

            ws.onclose = () => {
                document.getElementById('dot').className = 'w-2.5 h-2.5 rounded-full bg-rose-400';
                document.getElementById('status-text').innerText = 'Disconnected';
                setTimeout(initWebSocket, 3000);
            };
        }

        async function startAVStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
                    audio: true
                });

                pc = new RTCPeerConnection({ iceServers: [] });
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                // Listen for PC Desktop Audio return stream
                pc.ontrack = (event) => {
                    if (event.track.kind === "audio") {
                        const remoteAudio = document.getElementById("remoteAudio");
                        remoteAudio.srcObject = event.streams[0];
                    }
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const response = await fetch(`https://${host}/offer`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type,
                        enable_pc_to_phone: true
                    })
                });

                const answer = await response.json();
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
            } catch (err) {
                console.error("WebRTC AV Error:", err);
            }
        }

        function toggleStream(kind) {
            if (!localStream) return;
            const track = localStream.getTracks().find(t => t.kind === kind);
            if (track) {
                track.enabled = !track.enabled;
                const btn = document.getElementById(kind === 'video' ? 'cam-btn' : 'mic-btn');
                btn.className = track.enabled ? 'bg-slate-900 border border-slate-800 py-3 rounded-2xl text-xs font-bold flex flex-col items-center gap-1 shadow-sm' : 'bg-rose-900/40 border border-rose-700 py-3 rounded-2xl text-xs font-bold text-rose-300 flex flex-col items-center gap-1 shadow-sm';
            }
        }

        async function flipCamera() {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                if (pc) pc.close();
                await startAVStream();
            }
        }

        async function toggleTorch() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            if (track && 'applyConstraints' in track) {
                torchActive = !torchActive;
                try {
                    await track.applyConstraints({ advanced: [{ torch: torchActive }] });
                } catch(e) {}
            }
        }

        function toggleDragLock() {
            isDragging = !isDragging;
            const btn = document.getElementById('btn-drag');
            if (isDragging) {
                btn.className = "bg-amber-500 text-slate-950 font-bold border border-amber-400 rounded-2xl text-xs shadow-sm";
                if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ a: "drag_start" }));
            } else {
                btn.className = "bg-slate-900 border border-slate-800 rounded-2xl font-bold text-xs text-amber-400 transition shadow-sm";
                if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ a: "drag_end" }));
            }
        }

        let lastX = 0, lastY = 0, touchStartTime = 0;
        const pad = document.getElementById('trackpad');

        pad.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                touchStartTime = Date.now();
            }
        });

        pad.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && ws && ws.readyState === WebSocket.OPEN) {
                const dx = e.touches[0].clientX - lastX;
                const dy = e.touches[0].clientY - lastY;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                ws.send(JSON.stringify({ a: "mm", dx: dx, dy: dy, sens: 1.6 }));
            } else if (e.touches.length === 2 && ws && ws.readyState === WebSocket.OPEN) {
                const dy = e.touches[0].clientY - lastY;
                lastY = e.touches[0].clientY;
                ws.send(JSON.stringify({ a: "sc", dy: dy > 0 ? -1 : 1 }));
            }
        });

        pad.addEventListener('touchend', (e) => {
            if (Date.now() - touchStartTime < 180 && e.changedTouches.length === 1) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    if (navigator.vibrate) navigator.vibrate(15);
                    ws.send(JSON.stringify({ a: "c", b: "l" }));
                }
            }
        });

        document.getElementById('btn-left').onclick = () => {
            if (navigator.vibrate) navigator.vibrate(15);
            ws && ws.send(JSON.stringify({ a: "c", b: "l" }));
        };
        document.getElementById('btn-right').onclick = () => {
            if (navigator.vibrate) navigator.vibrate(15);
            ws && ws.send(JSON.stringify({ a: "c", b: "r" }));
        };

        async function uploadSelectedFile() {
            const input = document.getElementById('fileInput');
            if (!input.files.length) return;
            const formData = new FormData();
            formData.append('file', input.files[0]);

            try {
                await fetch(`https://${host}/api/upload`, { method: 'POST', body: formData });
                alert('File uploaded to PC!');
                input.value = '';
            } catch (err) {
                alert('Upload failed.');
            }
        }

        function startBatteryReporting() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(batt => {
                    const send = () => {
                        const level = Math.round(batt.level * 100);
                        document.getElementById('batt').innerText = `🔋 ${level}%`;
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ a: "telemetry", battery: level, charging: batt.charging, device: "Mobile" }));
                        }
                    };
                    send();
                    batt.onlevelchange = send;
                    batt.onchargingchange = send;
                });
            }
        }

        window.onload = initWebSocket;
    </script>
</body>
</html>
