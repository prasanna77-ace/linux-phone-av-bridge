<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Linux AV Bridge Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #38bdf8; --green: #22c55e; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
    .grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; max-width: 1050px; margin: auto; }
    .card { background: var(--panel); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    h1 { font-size: 1.5rem; color: var(--accent); margin-top: 0; }
    .status-badge { display: inline-flex; align-items: center; gap: 8px; font-weight: bold; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
    canvas { width: 100% !important; height: auto !important; border-radius: 8px; margin-top: 15px; }
    .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; }
    code { color: var(--accent); font-size: 0.95rem; }
    .card-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn { background: #334155; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
    .btn:hover { background: #475569; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card" style="text-align: center;">
      <h2 style="margin: 0 0 10px;">Connect Mobile</h2>
      <p style="color: #94a3b8; font-size: 0.85rem; margin: 0;">Scan with Phone Camera</p>
      <canvas id="qrCanvas"></canvas>
      <p style="word-break: break-all; margin-top: 12px;"><code id="phoneUrl">Loading...</code></p>
    </div>
    <div class="card">
      <h1>Production AV Hub</h1>
      <div class="status-badge"><div class="dot"></div> Server Ready</div>
      <div style="margin-top: 15px;">
        <div class="stat-row"><span>Video Device</span><code>/dev/video10 (PhoneWebcam)</code></div>
        <div class="stat-row"><span>Microphone Device</span><code>VirtualMic (Phone_Microphone)</code></div>
        <div class="stat-row"><span>Desktop Audio Source</span><code>@DEFAULT_MONITOR@</code></div>
        <div class="stat-row"><span>Active Streams</span><code id="activeConn">0</code></div>
      </div>
      <div class="card-actions">
        <a href="/phone" target="_blank" class="btn">Open Local Phone View</a>
        <button onclick="navigator.clipboard.writeText(document.getElementById('phoneUrl').innerText)" class="btn">Copy URL</button>
      </div>
    </div>
  </div>
  <script>
    async function refresh() {
      const res = await fetch('/api/status');
      const data = await res.json();
      document.getElementById('phoneUrl').innerText = data.mobile_url;
      document.getElementById('activeConn').innerText = data.active_connections;
      QRCode.toCanvas(document.getElementById('qrCanvas'), data.mobile_url, { width: 260, margin: 1 });
    }
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
