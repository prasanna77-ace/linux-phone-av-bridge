<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linux AV Bridge</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f1117; color: #fff; text-align: center; padding: 24px 16px; margin: 0; }
    button { padding: 14px 28px; font-size: 1rem; font-weight: 600; border-radius: 8px; border: none; background: #2563eb; color: white; cursor: pointer; }
    #status { margin-top: 18px; color: #94a3b8; font-size: 0.9rem; }
    video { width: 100%; max-width: 480px; border-radius: 10px; margin-top: 20px; background: #1e293b; aspect-ratio: 16/9; object-fit: cover; }
  </style>
</head>
<body>
  <h2>AV Bridge Client</h2>
  <button id="startBtn">Connect Camera & Mic</button>
  <div id="status">Ready to connect</div>
  <div><video id="preview" autoplay playsinline muted></video></div>

  <script>
    const pc = new RTCPeerConnection({ iceServers: [] });
    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');

    startBtn.onclick = async () => {
      try {
        status.innerText = "Requesting device permissions...";
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        document.getElementById('preview').srcObject = stream;
        stream.getTracks().forEach(track => pc.addTrack(track, stream));

        status.innerText = "Gathering LAN network routes...";
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // Wait for browser to collect local host ICE candidates
        await new Promise(resolve => {
          if (pc.iceGatheringState === 'complete') resolve();
          else {
            const check = () => {
              if (pc.iceGatheringState === 'complete') {
                pc.removeEventListener('icegatheringstatechange', check);
                resolve();
              }
            };
            pc.addEventListener('icegatheringstatechange', check);
          }
        });

        status.innerText = "Handshaking with PC...";
        const response = await fetch('/offer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
        });

        const answer = await response.json();
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
        status.innerText = "Live: Streaming Video & Mic to Linux";
        startBtn.style.display = "none";
      } catch (err) {
        status.innerText = "Error: " + err.message;
      }
    };
  </script>
</body>
</html>
