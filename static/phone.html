<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AV Modular Hub</title>
  <style>
    :root { --bg: #0b0f19; --card: #161e2e; --accent: #0284c7; --red: #ef4444; --green: #10b981; --border: #334155; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 14px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .card { width: 100%; max-width: 420px; background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
    h2 { margin: 0 0 10px 0; text-align: center; }
    .video-box { position: relative; width: 100%; max-width: 420px; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 16/9; margin-bottom: 12px; display: none; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    
    .meters { position: absolute; bottom: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 4px; }
    .meter-wrap { display: flex; align-items: center; gap: 6px; font-size: 0.65rem; color: #cbd5e1; }
    .meter-container { flex: 1; height: 5px; background: rgba(0,0,0,0.6); border-radius: 3px; overflow: hidden; }
    .meter-bar { width: 0%; height: 100%; background: var(--green); transition: width 0.05s linear; }
    
    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #1e293b; }
    .toggle-row:last-child { border-bottom: none; }
    .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #334155; transition: .3s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(22px); }

    .preset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 10px 0; }
    .preset-btn { background: #1e293b; border: 1px solid var(--border); color: #cbd5e1; padding: 8px 6px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; text-align: center; }
    .preset-btn:active { background: var(--accent); color: #fff; }

    .btn { background: #334155; color: white; border: none; padding: 12px 14px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-main { background: var(--accent); width: 100%; padding: 14px; font-size: 1rem; margin-top: 10px; }
    .btn-active { background: var(--red) !important; }
    .btn-green { background: var(--green) !important; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .range-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #94a3b8; margin-top: 10px; }
    input[type=range] { width: 55%; accent-color: var(--accent); }
    #blackout { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; justify-content: center; align-items: center; flex-direction: column; text-align: center; }
  </style>
</head>
<body>
  <h2>AV Modular Node</h2>

  <div class="card" id="configCard">
    <div style="font-size:0.8rem; color:#94a3b8; text-align:center; margin-bottom:8px;">QUICK PRESETS</div>
    <div class="preset-grid">
      <button class="preset-btn" onclick="applyPreset(true, true, true)">Full AV Bridge</button>
      <button class="preset-btn" onclick="applyPreset(true, true, false)">Webcam + Mic</button>
      <button class="preset-btn" onclick="applyPreset(false, true, false)">Mic Only</button>
      <button class="preset-btn" onclick="applyPreset(false, false, true)">Receiver Only (PC Audio)</button>
      <button class="preset-btn" onclick="applyPreset(true, false, false)">Camera Only</button>
      <button class="preset-btn" onclick="applyPreset(false, true, true)">Two-Way Intercom</button>
    </div>

    <div style="font-size:0.8rem; color:#94a3b8; text-align:center; margin:12px 0 6px;">CUSTOM CHANNELS</div>
    <div class="toggle-row">
      <span>📹 Phone Camera &rarr; PC</span>
      <label class="switch"><input type="checkbox" id="chkCam" checked><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span>🎙️ Phone Mic &rarr; PC</span>
      <label class="switch"><input type="checkbox" id="chkMic" checked><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span>🔊 PC Audio &rarr; Phone</span>
      <label class="switch"><input type="checkbox" id="chkPcAudio" checked><span class="slider"></span></label>
    </div>

    <button id="startBtn" class="btn btn-main">Launch Stream</button>
  </div>

  <div class="video-box" id="videoWrapper">
    <video id="preview" autoplay playsinline muted></video>
    <div class="meters">
      <div class="meter-wrap"><span>MIC</span><div class="meter-container"><div id="vuMic" class="meter-bar"></div></div></div>
      <div class="meter-wrap"><span>PC</span><div class="meter-container"><div id="vuPc" class="meter-bar" style="background:#38bdf8;"></div></div></div>
    </div>
  </div>
  <audio id="pcAudio" autoplay playsinline></audio>

  <div class="card" id="liveCard" style="display:none;">
    <div id="status" style="font-size: 0.85rem; color: #94a3b8; text-align: center; margin-bottom: 10px;">Connecting...</div>
    <div class="grid-btns">
      <button id="toggleMicBtn" class="btn">Mute Mic</button>
      <button id="toggleCamBtn" class="btn">Pause Video</button>
      <button id="togglePcAudioBtn" class="btn">Mute PC Sound</button>
      <button id="switchCamBtn" class="btn">Flip Lens</button>
      <button id="torchBtn" class="btn">Torch</button>
      <button id="dimBtn" class="btn">OLED Blackout</button>
      <button id="disconnectBtn" class="btn btn-active" style="grid-column: span 2;">Disconnect</button>
    </div>
    <div class="range-row" id="volRow">
      <span>Earphone Volume</span>
      <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
    </div>
  </div>

  <div id="blackout">
    <p style="color:#475569;">Stream Active (OLED Blackout Mode)</p>
    <button id="exitDim" class="btn" style="background:#222; border:1px solid #444;">Double Tap to Wake</button>
  </div>

  <script>
    let pc, localStream, audioContext, analyserMic, analyserPc, dataMic, dataPc, wakeLock = null;
    let facing = 'user', torchOn = false;
    let micMuted = false, camPaused = false, pcAudioMuted = false;

    const preview = document.getElementById('preview');
    const pcAudio = document.getElementById('pcAudio');
    const status = document.getElementById('status');
    const vuMic = document.getElementById('vuMic');
    const vuPc = document.getElementById('vuPc');

    function applyPreset(cam, mic, pcAud) {
      document.getElementById('chkCam').checked = cam;
      document.getElementById('chkMic').checked = mic;
      document.getElementById('chkPcAudio').checked = pcAud;
    }

    function initAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }

    function setupMicVisualizer(stream) {
      try {
        initAudioContext();
        const source = audioContext.createMediaStreamSource(stream);
        analyserMic = audioContext.createAnalyser();
        analyserMic.fftSize = 64;
        source.connect(analyserMic);
        dataMic = new Uint8Array(analyserMic.frequencyBinCount);
      } catch (e) {}
    }

    function setupPcVisualizer(stream) {
      try {
        initAudioContext();
        const source = audioContext.createMediaStreamSource(stream);
        analyserPc = audioContext.createAnalyser();
        analyserPc.fftSize = 64;
        source.connect(analyserPc);
        dataPc = new Uint8Array(analyserPc.frequencyBinCount);
      } catch (e) {}
    }

    function renderMeters() {
      if (analyserMic) {
        analyserMic.getByteFrequencyData(dataMic);
        let sum = 0;
        for (let i = 0; i < dataMic.length; i++) sum += dataMic[i];
        let avg = micMuted ? 0 : (sum / dataMic.length) * 2;
        vuMic.style.width = Math.min(100, avg) + "%";
      }
      if (analyserPc) {
        analyserPc.getByteFrequencyData(dataPc);
        let sum = 0;
        for (let i = 0; i < dataPc.length; i++) sum += dataPc[i];
        let avg = pcAudioMuted ? 0 : (sum / dataPc.length) * 2;
        vuPc.style.width = Math.min(100, avg) + "%";
      }
      requestAnimationFrame(renderMeters);
    }
    requestAnimationFrame(renderMeters);

    document.getElementById('startBtn').onclick = async () => {
      const wantCam = document.getElementById('chkCam').checked;
      const wantMic = document.getElementById('chkMic').checked;
      const wantPcAudio = document.getElementById('chkPcAudio').checked;

      if (!wantCam && !wantMic && !wantPcAudio) {
        alert("Please enable at least one channel.");
        return;
      }

      try {
        initAudioContext();
        pcAudio.play().catch(() => {});
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}

        pc = new RTCPeerConnection({ iceServers: [] });

        if (wantCam || wantMic) {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: wantCam ? { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 }, facingMode: facing } : false,
            audio: wantMic ? { echoCancellation: true, noiseSuppression: true, autoGainControl: true } : false
          });

          if (wantCam) {
            document.getElementById('videoWrapper').style.display = 'block';
            preview.srcObject = localStream;
            preview.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
          }
          if (wantMic) {
            setupMicVisualizer(localStream);
          }
          localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }

        pc.ontrack = (event) => {
          if (event.track.kind === 'audio') {
            const incomingStream = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([event.track]);
            pcAudio.srcObject = incomingStream;
            setupPcVisualizer(incomingStream);
            pcAudio.play().catch(e => console.error(e));
          }
        };

        if (wantPcAudio) {
          pc.addTransceiver('audio', { direction: 'recvonly' });
        }

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await new Promise(resolve => {
          if (pc.iceGatheringState === 'complete') resolve();
          else {
            const timer = setTimeout(resolve, 1000);
            pc.addEventListener('icegatheringstatechange', () => {
              if (pc.iceGatheringState === 'complete') {
                clearTimeout(timer);
                resolve();
              }
            });
          }
        });

        const res = await fetch('/offer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sdp: pc.localDescription.sdp,
            type: pc.localDescription.type,
            enable_pc_to_phone: wantPcAudio
          })
        });
        const answer = await res.json();
        await pc.setRemoteDescription(new RTCSessionDescription(answer));

        document.getElementById('configCard').style.display = 'none';
        document.getElementById('liveCard').style.display = 'block';
        status.innerText = "Bridge Connected (Live)";

        document.getElementById('toggleCamBtn').style.display = wantCam ? 'flex' : 'none';
        document.getElementById('switchCamBtn').style.display = wantCam ? 'flex' : 'none';
        document.getElementById('torchBtn').style.display = wantCam ? 'flex' : 'none';
        document.getElementById('toggleMicBtn').style.display = wantMic ? 'flex' : 'none';
        document.getElementById('togglePcAudioBtn').style.display = wantPcAudio ? 'flex' : 'none';
        document.getElementById('volRow').style.display = wantPcAudio ? 'flex' : 'none';

      } catch (err) {
        alert("Connection Error: " + err.message);
      }
    };

    document.getElementById('toggleMicBtn').onclick = function() {
      micMuted = !micMuted;
      localStream.getAudioTracks()[0].enabled = !micMuted;
      this.innerText = micMuted ? "Unmute Mic" : "Mute Mic";
      this.classList.toggle('btn-active', micMuted);
    };

    document.getElementById('toggleCamBtn').onclick = function() {
      camPaused = !camPaused;
      localStream.getVideoTracks()[0].enabled = !camPaused;
      this.innerText = camPaused ? "Resume Video" : "Pause Video";
      this.classList.toggle('btn-active', camPaused);
    };

    document.getElementById('togglePcAudioBtn').onclick = function() {
      pcAudioMuted = !pcAudioMuted;
      pcAudio.muted = pcAudioMuted;
      this.innerText = pcAudioMuted ? "Unmute PC Sound" : "Mute PC Sound";
      this.classList.toggle('btn-active', pcAudioMuted);
    };

    document.getElementById('switchCamBtn').onclick = async () => {
      facing = facing === 'user' ? 'environment' : 'user';
      torchOn = false;
      document.getElementById('torchBtn').classList.remove('btn-green');
      const newStream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 }, facingMode: facing }
      });
      const newTrack = newStream.getVideoTracks()[0];
      const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) sender.replaceTrack(newTrack);
      preview.srcObject = newStream;
      preview.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
    };

    document.getElementById('torchBtn').onclick = async function() {
      try {
        const track = preview.srcObject.getVideoTracks()[0];
        torchOn = !torchOn;
        await track.applyConstraints({ advanced: [{ torch: torchOn }] });
        this.classList.toggle('btn-green', torchOn);
      } catch(e) {
        alert("Torch unavailable on this lens.");
      }
    };

    document.getElementById('dimBtn').onclick = () => document.getElementById('blackout').style.display = 'flex';
    document.getElementById('exitDim').onclick = () => document.getElementById('blackout').style.display = 'none';
    document.getElementById('volSlider').oninput = (e) => pcAudio.volume = e.target.value;
    document.getElementById('disconnectBtn').onclick = () => location.reload();
  </script>
</body>
</html>
